[project]
name = "pedestrian-traffic-forecast"
version = "0.1.0"
description = "Hourly pedestrian counts in Melbourne: classical forecasting vs. a time series foundation model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "holidays>=0.60",
    "statsforecast>=2.0",
    "prophet>=1.1.6",
    "lightgbm>=4.5",
    "chronos-forecasting>=2.0",
    "torch>=2.5",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "streamlit>=1.40",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "optuna>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
